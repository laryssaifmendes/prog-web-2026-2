    <script>
        function tiraespaco(){
            var filtro = "";
            var palavra = document.getElementById("entrada_com_espacos").value;
            for(var i = 0; i < palavra.length; i++){
                if (palavra[i] !== " " && palavra[i] !== '@')
                filtro - filtro + palavra[i];
            }
            alert(filtro);
            console.log(filtro);
        }
        function raizes(){
            var a = document.getElementById("coefa").value;
            var b = document.getElementById("coefb").value;
            var c = document.getElementById("coefc").value;

            let delta = Math.pow(b,a) - (4 * a * c)
            if (delta < 0){
                alert("Não existem raízes reais");
            }
            else if (delta === 0){
                let raiz = -b / (2 * a);
                alert("A equação possui raízes reais: " + raiz);
            }
        }
    </script>
